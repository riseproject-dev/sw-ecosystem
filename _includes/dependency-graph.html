<!--
  Renders an interactive dependency graph from a stack report's <slug>.graph.json (see
  prompts/stack-report/stack-report.md, Artifact 4, for the schema and how it is produced).

  Usage: {% raw %}{% include dependency-graph.html slug="<vertical-slug>" %}{% endraw %}
  `slug` may be omitted on a stack-report page; it then defaults to page.slug.
-->
<link rel="stylesheet" href="{{ '/assets/css/dependency-graph.css' | relative_url }}">
<div class="dependency-graph" data-graph="{{ include.slug | default: page.slug }}.graph.json"></div>
<p class="dg-json-link"><a href="{{ include.slug | default: page.slug }}.graph.json">Raw dependency graph data (JSON)</a></p>
<script src="https://cdn.jsdelivr.net/npm/d3@5.16.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
<script src="{{ '/assets/js/dependency-graph.js' | relative_url }}"></script>
