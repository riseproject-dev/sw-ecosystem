vertical: Databases (OLTP + OLAP + KV/cache) -- self-managed open-source database stack
slug: databases
author: Ludovic Henry
run_date: 2026-08-27
audience: exec-product
target_profile: RVA23U64
use: >
  Deck for exec leadership on where to invest in RISC-V enablement across the open-source
  database stack (PostgreSQL, MySQL, MariaDB, Redis, Memcached), including feature-enabling
  plugins, clustering/proxies, the Kubernetes + observability deployment substrate, and the
  low-level shared libraries (compression, crypto, allocators, system runtime, vectorization).
  Structured with five per-product sub-verticals (Client Drivers, Database Engine, Extensions /
  Clustering & Proxies) plus two shared layers (Orchestration & Observability, System Libraries),
  so the layered stack outline pastes directly into a PowerPoint software-stack diagram.

assumptions:
  - "Five per-product sub-verticals: PostgreSQL, MySQL, MariaDB, Redis, Memcached. Each has
     three per-product layers (Client Drivers, Database Engine, Extensions / Clustering & Proxies)."
  - "Two shared layers span all five products: Orchestration & Observability (Kubernetes control
     plane, database operators, metrics pipeline) and System Libraries (compression, crypto,
     allocators, text, I/O, system runtime)."
  - "CPU-only per operator directive: no GPU / CUDA / ROCm paths."
  - "Target profile RVA23U64: RVV 1.0, vector crypto (Zvkned), Zba/Zbb/Zbc, and FP16 are
     treated as mandatory baseline, so missing SIMD/crypto acceleration is a gap against baseline."

exclusions: []

out_of_scope:
  - name: "Managed cloud database services (AWS RDS / Aurora / ElastiCache, GCP Cloud SQL / AlloyDB / MemoryStore, Azure Database)"
    reason: "Operator chose OSS-substrate-only; proprietary managed control planes are not native-RISC-V investment targets."
  - name: "GPU / CUDA / ROCm acceleration paths (GPU-accelerated analytics, GPU vector search)"
    reason: "CPU-only scope per operator directive."
  - name: "Windows and macOS server deployment"
    reason: "Linux/riscv64 server focus."

layers:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────

  - layer: "Client Drivers"
    product: PostgreSQL
    nodes:
      - name: libpq
        repo: https://git.postgresql.org/git/postgresql
        home: https://www.postgresql.org/docs/current/libpq.html
        criticality: critical
        features_in_scope: "C client library for PostgreSQL; in-tree (src/interfaces/libpq)"
        notes: "C, compiled arch-specific. Bundled in PostgreSQL; no standalone report -- covered by reports/postgresql.md. Ships in every distro libpq5 riscv64 package."
      - name: psycopg
        repo: https://github.com/psycopg/psycopg
        home: https://www.psycopg.org/
        criticality: optional
        features_in_scope: "PostgreSQL adapter for Python (psycopg 3)"
        notes: "Python with optional C (psycopg-c) and binary (psycopg-binary) extensions; pure-Python mode exists. Check PyPI + RISE wheel builder for riscv64 wheels."
      - name: pgx
        repo: https://github.com/jackc/pgx
        home: https://pkg.go.dev/github.com/jackc/pgx/v5
        criticality: optional
        features_in_scope: "Pure-Go PostgreSQL driver and toolkit"
        notes: "Pure Go; compiles to linux/riscv64 with the Go toolchain. No cgo on the default path."
      - name: pgjdbc
        repo: https://github.com/pgjdbc/pgjdbc
        home: https://jdbc.postgresql.org/
        criticality: optional
        features_in_scope: "PostgreSQL JDBC driver for the JVM"
        notes: "Pure-Java noarch jar; architecture-independent, inherits riscv64 from the JVM (Step 0 candidate)."

  - layer: "Database Engine"
    product: PostgreSQL
    nodes:
      - name: PostgreSQL
        repo: https://git.postgresql.org/git/postgresql
        home: https://www.postgresql.org/
        slug: postgresql
        criticality: critical
        features_in_scope: "Core server, MVCC storage, WAL, replication, TLS, optional JIT (LLVM)"
        notes: "C. Prior in reports/postgresql.md. Re-check: Zbb popcount / Zbc CRC32C patch series (open), JIT on riscv64, distro release status."

  - layer: "Extensions, Clustering & Proxies"
    product: PostgreSQL
    nodes:
      - name: pgvector
        repo: https://github.com/pgvector/pgvector
        home: https://github.com/pgvector/pgvector
        criticality: optional
        features_in_scope: "Vector similarity search extension for PostgreSQL (HNSW/IVFFlat); distance kernels"
        notes: "C, with SIMD distance kernels (x86 AVX / ARM NEON). RVV path is the vectorization question. Check for riscv64 build + any SIMD dispatch; likely scalar fallback."
      - name: PostGIS
        repo: https://github.com/postgis/postgis
        home: https://postgis.net/
        criticality: optional
        features_in_scope: "Geospatial extension for PostgreSQL (depends on GEOS, PROJ, GDAL)"
        notes: "C/C++. No report. Heavy transitive deps (GEOS/PROJ/GDAL) all in Debian riscv64. Check engine + deps build."
      - name: TimescaleDB
        repo: https://github.com/timescale/timescaledb
        home: https://www.timescale.com/
        criticality: optional
        features_in_scope: "Time-series extension for PostgreSQL (hypertables, continuous aggregates, compression)"
        notes: "C. No report. Uses SIMD-friendly columnar compression. Check riscv64 build + license (TSL vs Apache-2 core)."
      - name: Apache AGE
        repo: https://github.com/apache/age
        home: https://age.apache.org/
        criticality: optional
        features_in_scope: "Graph database extension for PostgreSQL (openCypher)"
        notes: "C. No report. Version-pinned to specific PostgreSQL majors. Check riscv64 build."
      - name: Citus
        repo: https://github.com/citusdata/citus
        home: https://www.citusdata.com/
        criticality: optional
        features_in_scope: "Distributed PostgreSQL (sharding) + columnar storage (OLAP) extension"
        notes: "C. No report. Check riscv64 build + distro/PGDG packaging."
      - name: Patroni
        repo: https://github.com/patroni/patroni
        home: https://patroni.readthedocs.io/
        criticality: optional
        features_in_scope: "PostgreSQL HA / automatic failover template (etcd/Consul/k8s DCS)"
        notes: "Pure Python; architecture-independent (Step 0 candidate), inherits riscv64 from CPython."
      - name: PgBouncer
        repo: https://github.com/pgbouncer/pgbouncer
        home: https://www.pgbouncer.org/
        criticality: optional
        features_in_scope: "Lightweight PostgreSQL connection pooler"
        notes: "C (libevent-based). No report. Near-ubiquitous in production PG. Check riscv64 build + distro packaging."
      - name: Pgpool-II
        repo: https://github.com/pgpool/pgpool2
        home: https://www.pgpool.net/
        criticality: optional
        features_in_scope: "PostgreSQL connection pool, load balancing, query routing"
        notes: "C. No report. Check riscv64 build + distro packaging."
      - name: pgcat
        repo: https://github.com/postgresml/pgcat
        home: https://github.com/postgresml/pgcat
        criticality: optional
        features_in_scope: "Rust PostgreSQL pooler/proxy with sharding and load balancing"
        notes: "Rust. No report. Needs Rust riscv64 target (tier 2). Check build + release (OCI images)."

  - layer: "Orchestration & Observability (per-product)"
    product: PostgreSQL
    nodes:
      - name: CloudNativePG
        repo: https://github.com/cloudnative-pg/cloudnative-pg
        home: https://cloudnative-pg.io/
        criticality: optional
        features_in_scope: "CNCF PostgreSQL operator for Kubernetes (primary community operator)"
        notes: "Go. No report. Operator binary is Go; the gate is the PostgreSQL container image arch."
      - name: Zalando postgres-operator
        repo: https://github.com/zalando/postgres-operator
        home: https://github.com/zalando/postgres-operator
        criticality: optional
        features_in_scope: "PostgreSQL operator (Patroni-based); secondary PG operator"
        notes: "Go. No report."
      - name: Percona Operator for MySQL
        repo: https://github.com/percona/percona-server-mysql-operator
        home: https://docs.percona.com/percona-operator-for-mysql/
        criticality: optional
        features_in_scope: "Kubernetes operator for Percona Server for MySQL / XtraDB Cluster"
        notes: "Go. No report. Gate is the Percona Server container image arch."
      - name: postgres_exporter
        repo: https://github.com/prometheus-community/postgres_exporter
        home: https://github.com/prometheus-community/postgres_exporter
        criticality: optional
        features_in_scope: "Prometheus exporter for PostgreSQL metrics"
        notes: "Go. No report. Check riscv64 release asset / CI."

  # ── MySQL ─────────────────────────────────────────────────────────────────────

  - layer: "Client Drivers"
    product: MySQL
    nodes:
      - name: MariaDB Connector/C
        repo: https://github.com/mariadb-corporation/mariadb-connector-c
        home: https://mariadb.com/kb/en/mariadb-connector-c/
        criticality: optional
        features_in_scope: "C client connector for MySQL (also used for MariaDB)"
        notes: "C, compiled. Packaged in Debian/Ubuntu riscv64."
      - name: go-sql-driver/mysql
        repo: https://github.com/go-sql-driver/mysql
        home: https://github.com/go-sql-driver/mysql
        criticality: optional
        features_in_scope: "Pure-Go MySQL/MariaDB driver for database/sql"
        notes: "Pure Go; compiles to linux/riscv64."

  - layer: "Database Engine"
    product: MySQL
    nodes:
      - name: MySQL
        repo: https://github.com/mysql/mysql-server
        home: https://www.mysql.com/
        slug: mysql
        criticality: critical
        features_in_scope: "Core server, InnoDB, group replication, TLS"
        notes: "C++. Prior in reports/mysql.md. Re-check: Debian/Ubuntu riscv64 package status, TempTable patch upstreaming, Abseil CRC32C gap. No Oracle official riscv64 release."

  - layer: "Extensions, Clustering & Proxies"
    product: MySQL
    nodes:
      - name: Vitess
        repo: https://github.com/vitessio/vitess
        home: https://vitess.io/
        criticality: optional
        features_in_scope: "Horizontal sharding / distributed MySQL (vtgate, vttablet)"
        notes: "Go (CNCF graduated). No report. Pure Go compiles to riscv64; check upstream release matrix for linux/riscv64 images."
      - name: ProxySQL
        repo: https://github.com/sysown/proxysql
        home: https://proxysql.com/
        criticality: optional
        features_in_scope: "SQL-aware proxy / load balancer for MySQL/MariaDB"
        notes: "C++ (bundles many deps). No report. Complex build. Check riscv64 build feasibility + release channel."

  - layer: "Orchestration & Observability (per-product)"
    product: MySQL
    nodes:
      - name: MySQL Operator for Kubernetes
        repo: https://github.com/mysql/mysql-operator
        home: https://dev.mysql.com/doc/mysql-operator/en/
        criticality: optional
        features_in_scope: "Oracle's official MySQL InnoDB Cluster operator"
        notes: "Python operator + MySQL container images. No report. Gate is the Oracle MySQL container image arch."
      - name: mysqld_exporter
        repo: https://github.com/prometheus/mysqld_exporter
        home: https://github.com/prometheus/mysqld_exporter
        criticality: optional
        features_in_scope: "Prometheus exporter for MySQL/MariaDB metrics"
        notes: "Go. No report. Check riscv64 release asset."

  # ── MariaDB ───────────────────────────────────────────────────────────────────

  - layer: "Client Drivers"
    product: MariaDB
    nodes:
      - name: MariaDB Connector/C
        repo: https://github.com/mariadb-corporation/mariadb-connector-c
        home: https://mariadb.com/kb/en/mariadb-connector-c/
        criticality: optional
        features_in_scope: "C client connector for MariaDB (also used for MySQL)"
        notes: "C, compiled. Packaged in Debian/Ubuntu riscv64."
      - name: go-sql-driver/mysql
        repo: https://github.com/go-sql-driver/mysql
        home: https://github.com/go-sql-driver/mysql
        criticality: optional
        features_in_scope: "Pure-Go MariaDB/MySQL driver for database/sql"
        notes: "Pure Go; compiles to linux/riscv64."

  - layer: "Database Engine"
    product: MariaDB
    nodes:
      - name: MariaDB
        repo: https://github.com/MariaDB/server
        home: https://mariadb.org/
        slug: mariadb
        criticality: critical
        features_in_scope: "Core server, InnoDB, Galera hooks, PCRE2 REGEXP, TLS"
        notes: "C/C++. Prior in reports/mariadb.md. Re-check: distro riscv64 status, MyRocks/RocksDB submodule (MDEV-29875), libatomic linkage."

  - layer: "Extensions, Clustering & Proxies"
    product: MariaDB
    nodes:
      - name: RocksDB
        repo: https://github.com/facebook/rocksdb
        home: https://rocksdb.org/
        criticality: optional
        features_in_scope: "LSM-tree KV store; underlies MyRocks; uses LZ4/zstd/snappy/zlib compression"
        notes: "C++. No report but named in reports/mariadb.md (MDEV-29875). Check riscv64 build/CI/release; compression lib deps."
      - name: MyRocks
        repo: https://github.com/facebook/mysql-5.6
        home: https://myrocks.io/
        criticality: optional
        features_in_scope: "RocksDB-backed LSM storage engine for MySQL/MariaDB"
        notes: "C++, bundled as a storage engine in MariaDB (submodule). Not cleanly buildable on riscv64 upstream (MDEV-29875 open critical); Debian ships mariadb-plugin-rocksdb riscv64."
      - name: MariaDB ColumnStore
        repo: https://github.com/mariadb-corporation/mariadb-columnstore-engine
        home: https://mariadb.com/kb/en/mariadb-columnstore/
        criticality: optional
        features_in_scope: "Distributed columnar analytics (OLAP) storage engine for MariaDB"
        notes: "C++. No report. Large codebase (UM/PM processes). Check riscv64 build feasibility; likely x86/arm-only today."
      - name: Galera Cluster
        repo: https://github.com/codership/galera
        home: https://galeracluster.com/
        criticality: optional
        features_in_scope: "Synchronous multi-master replication (wsrep) for MariaDB/MySQL/Percona XtraDB"
        notes: "C++. No report. Check riscv64 build + distro packaging (Debian galera-4 riscv64)."
      - name: MaxScale
        repo: https://github.com/mariadb-corporation/MaxScale
        home: https://mariadb.com/kb/en/maxscale/
        criticality: optional
        features_in_scope: "MariaDB's SQL-aware proxy / query router"
        notes: "C++ (BSL-licensed source-available). No report. Note license: Business Source License, not fully open. Check riscv64 build + release."

  - layer: "Orchestration & Observability (per-product)"
    product: MariaDB
    nodes:
      - name: mariadb-operator
        repo: https://github.com/mariadb-operator/mariadb-operator
        home: https://mariadb-operator.io/
        criticality: optional
        features_in_scope: "Cloud-native Kubernetes operator for MariaDB"
        notes: "Go. No report. Gate is the MariaDB container image arch."
      - name: mysqld_exporter
        repo: https://github.com/prometheus/mysqld_exporter
        home: https://github.com/prometheus/mysqld_exporter
        criticality: optional
        features_in_scope: "Prometheus exporter for MySQL/MariaDB metrics"
        notes: "Go. No report. Check riscv64 release asset."

  # ── Redis ─────────────────────────────────────────────────────────────────────

  - layer: "Client Drivers"
    product: Redis
    nodes:
      - name: hiredis
        repo: https://github.com/redis/hiredis
        home: https://redis.io/docs/latest/develop/clients/hiredis/
        criticality: critical
        features_in_scope: "C client / RESP protocol parser for Redis; bundled in redis"
        notes: "C, compiled. No standalone report -- discussed in reports/redis.md Section 9. Generic C, no arch-specific asm."

  - layer: "Database Engine"
    product: Redis
    nodes:
      - name: Redis
        repo: https://github.com/redis/redis
        home: https://redis.io/
        slug: redis
        criticality: critical
        features_in_scope: "Core in-memory KV store, RESP, persistence, bundled jemalloc/Lua, optional TLS/modules"
        notes: "C. Prior in reports/redis.md. Re-check: BITCOUNT Zbb + HLL RVV PRs (open), no upstream riscv64 CI."
      - name: Valkey
        repo: https://github.com/valkey-io/valkey
        home: https://valkey.io/
        criticality: optional
        features_in_scope: "Linux Foundation fork of Redis 7.2; drop-in Redis replacement"
        notes: "C. No per-project report yet. Increasingly the default Redis substitute in distros. Check for upstream riscv64 CI and distro packaging."
      - name: KeyDB
        repo: https://github.com/Snapchat/KeyDB
        home: https://docs.keydb.dev/
        criticality: optional
        features_in_scope: "Multi-threaded Redis-compatible fork"
        notes: "C++. No report. Check build/release status on riscv64; likely source-only."
      - name: Dragonfly
        repo: https://github.com/dragonflydb/dragonfly
        home: https://www.dragonflydb.io/
        criticality: optional
        features_in_scope: "Redis- and Memcached-API-compatible in-memory store"
        notes: "C++ (heavy use of intrusive libs, io_uring, possibly SIMD). No report. Check riscv64 build feasibility (io_uring dependency), release channel (OCI images)."

  - layer: "Extensions, Clustering & Proxies"
    product: Redis
    nodes:
      - name: RediSearch
        repo: https://github.com/RediSearch/RediSearch
        home: https://redis.io/docs/latest/develop/interact/search-and-query/
        criticality: optional
        features_in_scope: "Search + vector-search module for Redis (part of Redis Stack)"
        notes: "C/C++, Rust components. No report. Redis module build path (BUILD_WITH_MODULES) is broken on riscv64 per reports/redis.md. Check module build + SIMD vector kernels."
      - name: RedisJSON
        repo: https://github.com/RedisJSON/RedisJSON
        home: https://redis.io/docs/latest/develop/data-types/json/
        criticality: optional
        features_in_scope: "JSON document type module for Redis"
        notes: "Rust. No report. Ships a compiled shared object; needs Rust riscv64 target + Redis module loader. Check build."
      - name: RedisBloom
        repo: https://github.com/RedisBloom/RedisBloom
        home: https://redis.io/docs/latest/develop/data-types/probabilistic/
        criticality: optional
        features_in_scope: "Probabilistic data structures (Bloom/Cuckoo/Count-Min) module for Redis"
        notes: "C/C++. No report. Redis module. Check riscv64 build."
      - name: RedisTimeSeries
        repo: https://github.com/RedisTimeSeries/RedisTimeSeries
        home: https://redis.io/docs/latest/develop/data-types/timeseries/
        criticality: optional
        features_in_scope: "Time-series data type module for Redis"
        notes: "C/C++. No report. Redis module. Check riscv64 build."

  - layer: "Orchestration & Observability (per-product)"
    product: Redis
    nodes:
      - name: Redis Operator (OT-CONTAINER-KIT)
        repo: https://github.com/OT-CONTAINER-KIT/redis-operator
        home: https://ot-container-kit.github.io/redis-operator/
        criticality: optional
        features_in_scope: "Kubernetes operator for Redis / Redis Cluster"
        notes: "Go. No report. Gate is the Redis/Valkey image arch."
      - name: redis_exporter
        repo: https://github.com/oliver006/redis_exporter
        home: https://github.com/oliver006/redis_exporter
        criticality: optional
        features_in_scope: "Prometheus exporter for Redis/Valkey metrics"
        notes: "Go. No report. Check riscv64 release asset."

  # ── Memcached ─────────────────────────────────────────────────────────────────

  - layer: "Database Engine"
    product: Memcached
    nodes:
      - name: Memcached
        repo: https://github.com/memcached/memcached
        home: https://memcached.org/
        slug: memcached
        criticality: critical
        features_in_scope: "Core cache daemon, libevent event loop, optional TLS/SASL/seccomp, extstore"
        notes: "C. Prior in reports/memcached.md. Re-check: Debian riscv64 package, CRC32C software fallback, no upstream riscv64 CI."

  - layer: "Extensions, Clustering & Proxies"
    product: Memcached
    nodes:
      - name: mcrouter
        repo: https://github.com/facebook/mcrouter
        home: https://github.com/facebook/mcrouter
        criticality: optional
        features_in_scope: "Memcached protocol proxy / request router (Meta)"
        notes: "C++ (folly dependency, heavy). No report. Check riscv64 build feasibility (folly + SIMD) -- likely x86-only today."

  - layer: "Orchestration & Observability (per-product)"
    product: Memcached
    nodes:
      - name: memcached_exporter
        repo: https://github.com/prometheus/memcached_exporter
        home: https://github.com/prometheus/memcached_exporter
        criticality: optional
        features_in_scope: "Prometheus exporter for Memcached metrics"
        notes: "Go. No report. Check riscv64 release asset."

  # ── Shared: Orchestration & Observability ────────────────────────────────────

  - layer: "Orchestration & Observability"
    nodes:
      - name: Kubernetes
        repo: https://github.com/kubernetes/kubernetes
        home: https://kubernetes.io/
        slug: kubernetes
        criticality: optional
        features_in_scope: "Container orchestration control plane + kubelet (the on-prem deployment substrate)"
        notes: "Go. Prior in reports/kubernetes.md. Go binaries are arch-specific compiled artifacts. Check official linux/riscv64 release images + CI."
      - name: containerd
        repo: https://github.com/containerd/containerd
        home: https://containerd.io/
        slug: containerd
        criticality: optional
        features_in_scope: "Container runtime (CRI) for the k8s deployment path"
        notes: "Go. Prior in reports/containerd.md. Check riscv64 release binaries + CI."
      - name: runc
        repo: https://github.com/opencontainers/runc
        home: https://opencontainers.org/
        slug: runc
        criticality: optional
        features_in_scope: "OCI low-level container runtime"
        notes: "Go + cgo (seccomp/libseccomp). Prior in reports/runc.md. Check riscv64 release + libseccomp riscv64 support."
      - name: etcd
        repo: https://github.com/etcd-io/etcd
        home: https://etcd.io/
        slug: etcd
        criticality: optional
        features_in_scope: "Distributed KV store: k8s control-plane datastore and DCS for Patroni"
