      - name: Helm
        repo: https://github.com/helm/helm
        home: https://helm.sh/
        criticality: optional
        features_in_scope: "Kubernetes package manager (deploys DB charts)"
        notes: "Go. No report. Check official linux/riscv64 release binaries + CI."
      - name: k0s
        repo: https://github.com/k0sproject/k0s
        home: https://k0sproject.io/
        slug: k0s
        criticality: optional
        features_in_scope: "Zero-friction Kubernetes distribution with upstream riscv64 CI"
        notes: "Go. Prior in reports/k0s.md. Check riscv64 CI status and release artifact."
      - name: k3s
        repo: https://github.com/k3s-io/k3s
        home: https://k3s.io/
        slug: k3s
        criticality: optional
        features_in_scope: "Lightweight Kubernetes distribution (edge / small DB deployments)"
        notes: "Go. Prior in reports/k3s.md. Check riscv64 release."
      - name: Prometheus
        repo: https://github.com/prometheus/prometheus
        home: https://prometheus.io/
        slug: prometheus
        criticality: optional
        features_in_scope: "Metrics time-series database and scraper (monitoring backbone)"
        notes: "Go. Prior in reports/prometheus.md. Check official riscv64 release binaries + CI."
      - name: node_exporter
        repo: https://github.com/prometheus/node_exporter
        home: https://github.com/prometheus/node_exporter
        criticality: optional
        features_in_scope: "Host / hardware metrics exporter for Prometheus"
        notes: "Go. No report. Check official riscv64 release asset."
      - name: OpenTelemetry Collector
        repo: https://github.com/open-telemetry/opentelemetry-collector
        home: https://opentelemetry.io/
        slug: opentelemetry
        criticality: optional
        features_in_scope: "Vendor-neutral telemetry (metrics/traces/logs) pipeline"
        notes: "Go. Prior in reports/opentelemetry.md. Check riscv64 release binaries/images."
      - name: Grafana
        repo: https://github.com/grafana/grafana
        home: https://grafana.com/
        criticality: optional
        features_in_scope: "Observability dashboards / visualization"
        notes: "Go backend + TypeScript frontend. No report. Backend compiles to riscv64; frontend is browser-served. Check official riscv64 release/image."
      - name: Grafana Alloy
        repo: https://github.com/grafana/alloy
        home: https://grafana.com/oss/alloy/
        slug: grafana-alloy
        criticality: optional
        features_in_scope: "OpenTelemetry-based telemetry collector/agent"
        notes: "Go. Prior in reports/grafana-alloy.md. Check riscv64 release."

  # ── Shared: System Libraries ──────────────────────────────────────────────────

  - layer: "System Libraries"
    nodes:
      - name: OpenSSL
        repo: https://github.com/openssl/openssl
        home: https://www.openssl.org/
        slug: openssl
        criticality: critical
        features_in_scope: "TLS + crypto for every engine's encrypted connections"
        notes: "C + asm. Prior in reports/openssl.md. Key gap: AES not constant-time without Zkn/Zvkned; RVV/vector-crypto PRs open."
      - name: BoringSSL
        repo: https://boringssl.googlesource.com/boringssl
        home: https://boringssl.googlesource.com/boringssl
        slug: boringssl
        criticality: optional
        features_in_scope: "Google's TLS library; used by some clients/proxies (e.g. gRPC-based tooling)"
        notes: "C/C++ + asm. Prior in reports/boringssl.md. Not the default for these DB engines (OpenSSL is)."
      - name: zlib
        repo: https://github.com/madler/zlib
        home: https://zlib.net/
        slug: zlib
        criticality: critical
        features_in_scope: "DEFLATE compression: wire protocol + page/row compression across engines"
        notes: "C. Prior in reports/zlib.md. No RVV path; scalar on riscv64 (performance gap, not correctness)."
      - name: zlib-ng
        repo: https://github.com/zlib-ng/zlib-ng
        home: https://github.com/zlib-ng/zlib-ng
        slug: zlib-ng
        criticality: optional
        features_in_scope: "SIMD-optimized zlib replacement (drop-in); relevant to the vectorization story"
        notes: "C. Prior in reports/zlib-ng.md. Check riscv64 RVV optimization status."
      - name: LZ4
        repo: https://github.com/lz4/lz4
        home: https://lz4.github.io/lz4/
        slug: lz4
        criticality: critical
        features_in_scope: "Fast compression: MySQL redo log, RocksDB, general page compression"
        notes: "C. Prior in reports/lz4.md. LZ4_FAST_DEC_LOOP not enabled on riscv64 -- performance gap."
      - name: zstd
        repo: https://github.com/facebook/zstd
        home: https://facebook.github.io/zstd/
        slug: zstd
        criticality: critical
        features_in_scope: "High-ratio compression: PG/MySQL/MariaDB page + WAL/binlog, RocksDB"
        notes: "C. Prior in reports/zstd.md. HUF 4-way decode loop disabled on riscv64; no RVV -- performance gap, not correctness."
      - name: snappy
        repo: https://github.com/google/snappy
        home: https://github.com/google/snappy
        slug: snappy
        criticality: optional
        features_in_scope: "Fast compression used by RocksDB / MyRocks"
        notes: "C++. Prior in reports/snappy.md. Check riscv64 build + any SIMD path."
      - name: jemalloc
        repo: https://github.com/jemalloc/jemalloc
        home: https://jemalloc.net/
        slug: jemalloc
        criticality: critical
        features_in_scope: "Default bundled allocator for Redis; optional for MySQL/MariaDB"
        notes: "C. Prior in reports/jemalloc.md. riscv64gc support since Nov 2023; bundled in Redis -- load-bearing there."
      - name: tcmalloc
        repo: https://github.com/google/tcmalloc
        home: https://google.github.io/tcmalloc/
        slug: tcmalloc
        criticality: optional
        features_in_scope: "Optional allocator (MySQL optional; gperftools variant)"
        notes: "C++. Prior in reports/tcmalloc.md. Check riscv64 support (stacktrace/unwind gaps noted for gperftools)."
      - name: PCRE2
        repo: https://github.com/PCRE2Project/pcre2
        home: https://www.pcre.org/
        slug: pcre2
        criticality: critical
        features_in_scope: "Regex engine for MariaDB REGEXP (JIT via SLJIT); also used by proxies"
        notes: "C. Prior in reports/pcre2.md. SLJIT has sljitNativeRISCV_64.c; check current JIT status."
      - name: ICU
        repo: https://github.com/unicode-org/icu
        home: https://icu.unicode.org/
        slug: icu
        criticality: critical
        features_in_scope: "Unicode collation / locale for PostgreSQL and MySQL"
        notes: "C/C++. Prior in reports/icu.md. Pure C/C++, builds cleanly. Check distro riscv64."
      - name: libevent
        repo: https://github.com/libevent/libevent
        home: https://libevent.org/
        slug: libevent
        criticality: critical
        features_in_scope: "Event loop: mandatory for Memcached, used by MySQL Router / PgBouncer"
        notes: "C. Prior in reports/libevent.md. Generic C, no riscv64 issues; no upstream riscv64 CI."
      - name: liburing
        repo: https://github.com/axboe/liburing
        home: https://github.com/axboe/liburing
        slug: liburing
        criticality: optional
        features_in_scope: "io_uring async I/O: PostgreSQL AIO, memcached proxy, Dragonfly"
        notes: "C. Prior in reports/liburing.md. Upstream CI has an explicit riscv64 cross-compile entry."
      - name: libnuma
        repo: https://github.com/numactl/numactl
        home: https://github.com/numactl/numactl
        slug: libnuma
        criticality: optional
        features_in_scope: "NUMA-aware memory: InnoDB interleave allocation"
        notes: "C. Prior in reports/libnuma.md. Library has no riscv64 gaps; NUMA topology sparse on current silicon."
      - name: Protocol Buffers
        repo: https://github.com/protocolbuffers/protobuf
        home: https://protobuf.dev/
        slug: protobuf
        criticality: optional
        features_in_scope: "MySQL group replication wire protocol, X Protocol, NDB Cluster"
        notes: "C++. Prior in reports/protobuf.md. Check current riscv64 status."
      - name: Lua
        repo: https://github.com/lua/lua
        home: https://www.lua.org/
        criticality: optional
        features_in_scope: "Scripting: Redis EVAL (Lua 5.1 bundled), memcached proxy (Lua 5.4 vendored)"
        notes: "C (portable ANSI C, no arch asm). No standalone report -- covered inside reports/redis.md and reports/memcached.md. Architecture-neutral source."
      - name: xxHash
        repo: https://github.com/Cyan4973/xxHash
        home: https://xxhash.com/
        criticality: optional
        features_in_scope: "Non-cryptographic hashing: Redis, memcached proxy routing, RocksDB"
        notes: "C. No standalone report. Check RVV backend implementation status."
      - name: glibc
        repo: https://sourceware.org/git/glibc.git
        home: https://www.gnu.org/software/libc/
        slug: glibc
        criticality: critical
        features_in_scope: "C runtime, libm, pthreads, sub-word atomics (libatomic) -- required by every engine"
        notes: "C + asm. Prior in reports/glibc.md. riscv64 is a first-class glibc port."
      - name: libmvec
        repo: https://sourceware.org/git/glibc.git
        home: https://www.gnu.org/software/libc/
        slug: libmvec
        criticality: optional
        features_in_scope: "Vector math functions (part of glibc); vectorization baseline"
        notes: "C + asm. Prior in reports/libmvec.md. Check riscv64 RVV vector-math availability."

chains:
  - name: "PostgreSQL vector search path"
    sequence: ["Application", "libpq/psycopg", "PostgreSQL", "pgvector", "SIMD distance kernels (RVV target; scalar fallback today)"]
  - name: "MySQL/MariaDB LSM storage path"
    sequence: ["MySQL/MariaDB", "MyRocks", "RocksDB", "LZ4 / zstd / snappy compression", "glibc"]
  - name: "Distributed MySQL (sharding) path"
    sequence: ["Application", "Vitess vtgate", "Vitess vttablet", "MySQL shard", "InnoDB"]
  - name: "PostgreSQL HA on Kubernetes path"
    sequence: ["CloudNativePG operator", "PostgreSQL pod (container image)", "streaming replication", "etcd / k8s API"]
  - name: "TLS / encrypted connection path"
    sequence: ["Engine", "OpenSSL", "AES-GCM (Zvkned / Zkn hardware; non-constant-time scalar fallback without them)"]
  - name: "Compression path (vectorization gap)"
    sequence: ["Engine / RocksDB", "zstd / LZ4 / zlib", "RVV vectorized decode (NOT enabled today -> scalar)"]
  - name: "CRC32C checksum path (vectorization gap)"
    sequence: ["InnoDB / PostgreSQL / extstore", "CRC32C", "Zbc/Zbkc clmul hardware (patches open; scalar fallback today)"]
  - name: "KV cache on Kubernetes path"
    sequence: ["Redis Operator", "Redis / Valkey pod (container image)", "jemalloc", "glibc"]
  - name: "Observability path"
    sequence: ["Engine", "postgres_/mysqld_/redis_/memcached_exporter", "Prometheus", "Grafana", "(OpenTelemetry Collector / Grafana Alloy pipeline)"]
