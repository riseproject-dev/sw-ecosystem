nodes:
  - name: "LangChain"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "LangChain ships exclusively as a `py3-none-any` wheel for every release; the live PyPI check on 2026-08-28 confirms langchain-1.3.18 carries the `py3-none-any` tag, so `pip install langchain` works on riscv64 without modification. Under Step 0 of the color model, a pure-Python architecture-independent wheel is classified green with no CI requirement. LangChain contains no compiled extensions, SIMD code, or architecture-specific paths; the report and live check are fully consistent. See [PyPI langchain 1.3.18](https://pypi.org/project/langchain/1.3.18/)."
  - name: "LangGraph"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "LangGraph ships exclusively as a `py3-none-any` universal wheel on PyPI, confirmed at version 1.2.11 by live PyPI JSON API check on 2026-08-28. The color-coding Step 0 shortcut applies: no compiled, architecture-specific code exists in the project (confirmed by full code search in [reports/langgraph.md](reports/langgraph.md)), so riscv64 support is guaranteed by construction. LangChain Inc. publishes directly to PyPI, satisfying the release-provider requirement for green."
  - name: "langchain-core"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "langchain-core ships exclusively as a `py3-none-any` wheel -- confirmed: [`langchain_core-1.6.1-py3-none-any.whl`](https://pypi.org/pypi/langchain-core/1.6.1/json) uploaded 2026-08-27, with no platform-specific variants. The build backend is `hatchling` (pure Python, no native extensions), confirmed via the [pyproject.toml](https://raw.githubusercontent.com/langchain-ai/langchain/master/libs/core/pyproject.toml). Under Step 0 of the color model, a pure-Python `py3-none-any` wheel runs on riscv64 by construction and is classified green without requiring riscv64 CI; the optimization-purpose modifier does not apply to an orchestration library."
  - name: "langsmith"
    color: "green"
    criticality: "optional"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "The core `langsmith` package ships exclusively as a `py3-none-any` wheel (confirmed at [PyPI langsmith 0.11.2](https://pypi.org/pypi/langsmith/json): two artifacts, `langsmith-0.11.2-py3-none-any.whl` and the sdist), triggering the Step 0 architecture-independent shortcut -- green with no CI requirement. The optional `langsmith[langsmith_pyo3]` Rust extension extra publishes only x86_64, aarch64, and macOS arm64 wheels (no riscv64), but this extra is explicitly optional and not required for core tracing and observability. No riscv64-specific compiled artifacts are present in the main package, and `release_provider` is upstream (langchain-ai on PyPI)."
  - name: "langgraph-checkpoint"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "langgraph-checkpoint 4.2.0 ships exclusively as a `py3-none-any` wheel confirmed at [PyPI langgraph-checkpoint 4.2.0](https://pypi.org/pypi/langgraph-checkpoint/json). Per Step 0, the package contains no compiled code of its own and installs on riscv64 by construction; upstream (LangChain Inc.) publishes directly to PyPI. The required dependency `ormsgpack>=1.12.0` has no prebuilt riscv64 wheel and requires a Rust source build, but this is a dependency-level friction issue and does not change the color of langgraph-checkpoint itself under the Step 0 rule."
  - name: "langgraph-prebuilt"
    color: "green"
    criticality: "optional"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "langgraph-prebuilt ships exclusively as a [py3-none-any wheel on PyPI](https://pypi.org/pypi/langgraph-prebuilt/json) (v1.1.0), confirmed by live check: the package uses hatchling with no compiled extensions, and all source files under `libs/prebuilt/langgraph/prebuilt/` are pure Python. Under Step 0 of the color model, a py3-none-any wheel is architecture-independent and runs on riscv64 by construction. The wheel is published directly by upstream (langchain-ai) to PyPI."
  - name: "langgraph-sdk"
    color: "green"
    criticality: "optional"
    column: null
    layer: "Orchestration & Agents"
    release_provider: "upstream"
    upstream_release: true
    gap: "Step 0 applies: all releases on PyPI ship exclusively as `py3-none-any` wheels (confirmed for both the cited v0.1.70 and the current v0.4.4 at [PyPI](https://pypi.org/pypi/langgraph-sdk/json)). The source tree under `libs/sdk-py/` contains only `.py` files and uses `hatchling` as its build backend with no compiled extensions, confirming the package is architecture-independent and installs on riscv64 by construction with no modifications needed."
  - name: "vLLM (CPU backend)"
    color: "orange"
    criticality: "critical"
    column: null
    layer: "Inference Serving"
    release_provider: "none"
    upstream_release: false
    gap: "vLLM has no riscv64 CI across all 10 GitHub Actions workflow files (confirmed live 2026-08-28) and no riscv64 release artifact from any source -- PyPI v0.28.0 ships only x86_64 and aarch64 wheels, RISE does not package vLLM, and vLLM is absent from Debian, Ubuntu 24.04, and Arch RISC-V. The proposed `color_case: downstream-only` is factually wrong: \"downstream-only\" requires a downstream distro or third party to actually ship the package, which none does. The correct call is plain orange (no CI, no distribution floor at all) with an empty color_case. The color itself (orange) is upheld; the sub-type label is corrected. See [PyPI vllm](https://pypi.org/pypi/vllm/json) and [.github/workflows listing](https://github.com/vllm-project/vllm/tree/main/.github/workflows)."
  - name: "llama.cpp"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Inference Serving"
    release_provider: "Debian"
    upstream_release: false
    gap: "The `ubuntu-cpu-riscv64-native` job in [build-riscv.yml](https://github.com/ggerganov/llama.cpp/blob/master/.github/workflows/build-riscv.yml) runs `ctest -L main --verbose --timeout 900` on RISE bare-metal `ubuntu-24.04-riscv` runners on every push to master, confirming native test execution -- not build-only. No upstream riscv64 release binaries exist (issue [#20988](https://github.com/ggerganov/llama.cpp/issues/20988) closed not-planned; PR [#20991](https://github.com/ggerganov/llama.cpp/pull/20991) open but unmerged); Debian sid is the only pre-built source. As an optimization-purpose project, the RVV optimization level is partial: vec dot covers all major quant formats and repack GEMM/GEMV covers Q4_0, Q4_K, Q8_0, Q2_K, IQ4_NL (the dominant inference formats), but Q3_K, Q5_K, Q6_K, Q5_0, Q5_1 repack paths remain scalar (draft PR [#23745](https://github.com/ggerganov/llama.cpp/pull/23745) still open as of 2026-08-28), capping the grade at blue."
  - name: "ExecuTorch"
    color: "blue"
    criticality: "optional"
    column: null
    layer: "Inference Serving"
    release_provider: "none"
    upstream_release: false
    gap: "The [riscv64.yml](https://github.com/pytorch/executorch/blob/main/.github/workflows/riscv64.yml) workflow calls `_test_riscv.yml`, which cross-compiles executor_runner and runs it under `qemu-riscv64-static`, checking for \"Test_result: PASS\" via `run.sh` -- confirmed genuine test execution, not build-only. Latest release v1.4.1 has only `.pack` and `.pdsc` assets with no riscv64 binary, PR #19917 (baremetal bare-metal tests) remains open and unmerged, and no riscv64 artifact appears on PyPI, Ubuntu, Debian, Arch RISC-V, or the RISE wheel builder -- so the release-provider prerequisite for green is not met."
  - name: "FastAPI"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Inference Serving"
    release_provider: "upstream"
    upstream_release: true
    gap: "FastAPI ships exclusively as a [py3-none-any wheel on PyPI](https://pypi.org/pypi/fastapi/json) (version 0.141.1, confirmed live), with no compiled extensions and `pdm.backend` as its build backend. Step 0 of the color model applies: the architecture-independent pure-Python package installs on riscv64 by construction. The [publish workflow](https://github.com/fastapi/fastapi/blob/master/.github/workflows/publish.yml) runs a single `uv build` on ubuntu-latest producing the universal wheel; upstream publishes it directly to PyPI, satisfying the release_provider prerequisite for green. Note: upstream CI (test.yml) runs only on ubuntu/windows/macos -- there is no riscv64 CI runner -- but this is irrelevant under Step 0, which grants green without requiring riscv64 CI for architecture-independent packages."
  - name: "Starlette"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Inference Serving"
    release_provider: "upstream"
    upstream_release: true
    gap: "Starlette ships exclusively as a `py3-none-any` wheel (confirmed for the latest release [starlette-1.6.0-py3-none-any.whl](https://pypi.org/pypi/starlette/1.6.0/json)); pyproject.toml uses hatchling with no C extensions, Cython, or compiled artifacts. Step 0 applies: architecture-independent, runs on riscv64 by construction. The proposed classification referenced stale version 0.46.2 (April 2025); the current version is 1.6.0 (published 2026-08-08), but the classification color is unchanged."
