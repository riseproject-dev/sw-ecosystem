  - name: "PyTorch (CPU eager inference)"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "ML Framework"
    release_provider: "Debian"
    upstream_release: false
    gap: "The in-tree [`.github/workflows/riscv64.yml`](https://github.com/pytorch/pytorch/blob/main/.github/workflows/riscv64.yml) contains exactly one job (`pytorch-linux-noble-riscv64-py3_12-gcc14-cross-build`) calling `_linux-build.yml` with no test matrix, confirmed build-only CI (verified 2026-08-28). ATen CPU vectorization has zero RVV dispatch: the `CPUCapability` enum (DispatchStub.h, verified 2026-08-28) lists DEFAULT/VSX/ZVECTOR/SVE256/SVE128/AVX2/AVX512 but no RVV entry, and PR #175746 (RVV ATen vec) was closed without merging (state: closed, merged_at: null). One RVV kernel exists (DepthwiseConvKernel.cpp, 76 RVV lines from PR #127867) giving a minimal optimization level that caps at yellow - matching the primary CI grade. RISE out-of-tree CI (riseproject-dev/pytorch-ci) now has a test job on native riscv64 hardware but is conditional (`enable-tests` input), out-of-tree, and does not gate upstream PRs, so it does not raise the upstream CI tier. Debian sid ships v2.12.0+dfsg2-4 as the only binary release channel; no riscv64 wheel on PyPI or RISE."
  - name: "HuggingFace Transformers"
    color: "green"
    criticality: "critical"
    column: null
    layer: "ML Framework"
    release_provider: "upstream"
    upstream_release: true
    gap: "HuggingFace Transformers is a pure-Python library that ships exclusively as a `py3-none-any` wheel, confirmed live against the [PyPI JSON API](https://pypi.org/pypi/transformers/json) on 2026-08-28 showing `transformers-5.16.1-py3-none-any.whl` as the sole wheel artifact. Under Step 0 of the color model it is architecture-independent and runs on riscv64 by construction. The `setup.py` has no `ext_modules`, no `Extension()`, no Cython, and no `build_ext`; the `pyproject.toml` is linting-only; Step 2 (optimization-purpose modifier) does not apply because all compute is delegated to backend frameworks."
  - name: "Accelerate"
    color: "green"
    criticality: "optional"
    column: null
    layer: "ML Framework"
    release_provider: "upstream"
    upstream_release: true
    gap: "Accelerate 1.14.0 ships exclusively as a `py3-none-any` wheel on [PyPI](https://pypi.org/pypi/accelerate/json) with no compiled extensions (setup.py contains no `ext_modules`). Under Step 0 of the color model, architecture-independent packages are classified green -- they run on riscv64 by construction, inheriting RISC-V support from the Python runtime. Accelerate is not optimization-purpose (it is a distributed-training abstraction layer, not a SIMD/performance library), so the Step 2 modifier does not apply."
  - name: "HuggingFace Hub"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Model Ecosystem"
    release_provider: "upstream"
    upstream_release: true
    gap: "HuggingFace Hub ships exclusively as a `py3-none-any` wheel with no compiled extensions -- confirmed by [PyPI metadata](https://pypi.org/pypi/huggingface_hub/json) showing v1.29.0 (2026-08-27) as `huggingface_hub-1.29.0-py3-none-any.whl` only, and by [setup.py](https://raw.githubusercontent.com/huggingface/huggingface_hub/main/setup.py) which contains no `ext_modules`, CFFI, Cython, or Rust extensions. Per Step 0 of the color model, a pure-Python `py3-none-any` package is architecture-independent and runs on riscv64 by construction; upstream publishes directly on PyPI."
  - name: "HuggingFace Tokenizers"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Model Ecosystem"
    release_provider: "upstream"
    upstream_release: true
    gap: "Live inspection of [CI.yml](https://github.com/huggingface/tokenizers/blob/main/.github/workflows/CI.yml) confirms the riscv64 matrix entry has only \"Build wheels\" and \"Upload wheels\" steps -- no test execution step exists for riscv64 on any trigger. Despite this, upstream publishes a `manylinux_2_31_riscv64` wheel to PyPI since v0.23.1 (Apr 27, 2026, confirmed via PyPI JSON API). Yellow is correct: build-only CI caps at yellow regardless of release availability; green requires test execution. The optimization-purpose modifier does not apply because tokenizers is pure scalar Rust with no arch-specific code paths and its value proposition is correctness, not speed over a reference."
  - name: "SentencePiece"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Model Ecosystem"
    release_provider: "RISE"
    upstream_release: false
    gap: "The live [cross_build.yml](https://github.com/google/sentencepiece/blob/master/.github/workflows/cross_build.yml) (verified 2026-08-28) confirms riscv64 is in the arch matrix and the \"Test on QEMU\" step (`qemu-riscv64 ... src/spm_test`) is only skipped for sparc64 and sh4 -- riscv64 executes the full test suite. No riscv64 wheel appears in the v0.2.2 release assets (published 2026-07-12); `wheel.yml` still has `CIBW_ARCHS_LINUX: auto` with no riscv64 entry. Riscv64 wheels remain available only from the RISE unofficial wheel builder registry."
  - name: "Tiktoken"
    color: "yellow"
    criticality: "optional"
    column: null
    layer: "Model Ecosystem"
    release_provider: "RISE"
    upstream_release: false
    gap: "Upstream CI ([build_wheels.yml](https://github.com/openai/tiktoken/blob/main/.github/workflows/build_wheels.yml)) has no riscv64 job (confirmed live 2026-08-28), and PyPI carries no riscv64 wheel for the latest version 0.14.0 (released 2026-08-17). Debian sid builds `python3-tiktoken 0.12.0-2` on native riscv64 hardware (`rv-osuosl-04`, status: Installed) from unpatched upstream source (the three Debian patches lower dependency versions and adjust build metadata, none are riscv64-specific), applying the clean-distro-build yellow floor. RISE (via BayLibre) also publishes binary wheels at its GitLab PyPI index; upstream [PR #506](https://github.com/openai/tiktoken/pull/506) adding riscv64 CI remains open and unmerged as of 2026-08-28."
  - name: "NumPy"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Model Ecosystem"
    release_provider: "RISE"
    upstream_release: false
    gap: "The native riscv64 CI workflow ([linux_riscv64.yml](https://github.com/numpy/numpy/blob/main/.github/workflows/linux_riscv64.yml)) is confirmed build-only: `cibuildwheel` runs with no `CIBW_TEST_COMMAND`, no `spin test` step, and no `pytest` invocation -- the job is named \"Build wheel\" exclusively. QEMU CI ([linux_qemu.yml](https://github.com/numpy/numpy/blob/main/.github/workflows/linux_qemu.yml)) does run tests via `spin test` but carries `continue-on-error: true` making it non-blocking. No upstream riscv64 wheel exists on PyPI (NumPy 2.5.2 has zero riscv64 entries); RISE provides wheels up to 2.5.2. The NPYV layer has no RVV backend, so all ~22 arithmetic, transcendental, reduction, and comparison ufunc kernels fall back to scalar C -- this \"minimal\" optimization level caps the grade at yellow, consistent with the CI-based grade already being yellow."
  - name: "SafeTensors"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Model Ecosystem"
    release_provider: "upstream"
    upstream_release: true
    gap: "The live CI workflow file at `.github/workflows/python-release.yml` confirms the riscv64 matrix entry contains only checkout, maturin-action cross-build, and upload-artifact steps -- no pytest, no QEMU, no test execution -- identical to what the 2026-06-17 report documented. An official `safetensors-0.8.0-cp310-abi3-manylinux_2_31_riscv64.whl` is published to [PyPI by upstream](https://pypi.org/pypi/safetensors/json), but publishing a wheel without test execution does not satisfy the green criterion; per the color model, green requires the test suite to pass in CI, and yellow explicitly allows \"no / either\" in the artifact column. The project has no architecture-specific code on any platform (pure portable Rust + PyO3), so the optimization-purpose modifier (Step 2) does not apply and cannot cap the color further."
  - name: "ONNX Runtime (CPU EP)"
    color: "yellow"
    criticality: "optional"
    column: null
    layer: "Model Ecosystem"
    release_provider: "Debian"
    upstream_release: false
    gap: "No riscv64 CI exists in microsoft/onnxruntime, confirmed live by listing all 50+ workflow files under .github/workflows/ with no riscv/rv64 hits. Debian sid ships onnxruntime 1.23.2+dfsg-6+b5 for riscv64 (built on rv-osuosl-01, status \"Installed\"), and the Debian packaging repository at salsa.debian.org contains 18-19 patches none of which are riscv64-specific (names cover ARM32 test disable, Power10, GCC 14 fixes, system-library substitutions, and Eigen compatibility -- no RISC-V targeting). The optimization-purpose modifier (11 RVV MLAS kernel files = Partial coverage) caps at blue, which is above yellow and therefore does not lower the distro-floor yellow grade."
