  - name: "OpenBLAS"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Compute"
    release_provider: "none"
    upstream_release: false
    gap: "Upstream CI at [OpenMathLib/OpenBLAS `riscv64_vector.yml`](https://github.com/OpenMathLib/OpenBLAS/blob/develop/.github/workflows/riscv64_vector.yml) builds and runs BLAS L1/L2/L3 and CBLAS tests under QEMU for ZVL128B, ZVL256B, and DYNAMIC_ARCH targets, confirming blue (not yellow). No upstream riscv64 binary release exists. Optimization level is partial: GEMM fully covered with RVV intrinsics; TRSM now has partial RVV coverage (STRSM all variants, D/C/ZTRSM RN+RT via RVV) in v0.3.34 after PR #5830 merged 2026-08-16, but DTRSM/CTRSM/ZTRSM LN+LT cases still fall back to generic C - partial optimization caps at blue, matching the primary grade."
  - name: "Eigen"
    color: "blue"
    criticality: "optional"
    column: null
    layer: "Compute"
    release_provider: "none"
    upstream_release: false
    gap: "Upstream CI on [ci/test.linux.gitlab-ci.yml](https://gitlab.com/libeigen/eigen/-/raw/master/ci/test.linux.gitlab-ci.yml) runs full CTest suites on native SpacemiT riscv64 hardware (gcc-15 and clang-21 as of 2026-08-28, upgraded from gcc-14/clang-18), but all riscv64 jobs carry `allow_failure: true` and no released version (latest 5.0.1, 2025-11-08) contains the RVV backend -- it is master-only. The RVV backend covers primary hot paths (GEMM, packet math for int/float/FP16/BF16/complex) qualifying as partial optimization, capped at blue; transcendental functions (exp/log/sin/cos) and masked partial-packet tails (`has_packet_segment`) still use scalar fallback."
  - name: "oneDNN (DNNL)"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Compute"
    release_provider: "none"
    upstream_release: false
    gap: "The `ci-riscv.yml` workflow file (verified live 2026-08-28) contains a distinct `test` job with a \"Run oneDNN tests\" step executing SMOKE tests under QEMU at vlen=128 and vlen=256, confirming genuine test execution not merely a build step. No upstream binary artifacts exist: all GitHub releases are source-only tags and no riscv64 PyPI wheel is present, so release_provider is none. As an optimization-purpose library, the rv64 directory (confirmed live: `src/cpu/rv64/`) contains JIT RVV implementations covering the primary hot paths (f32/f16/bf16 conv, matmul, GEMM, pooling, softmax, layernorm, eltwise) via xbyak_riscv; INT8 conv/matmul (s8/u8) is absent, placing optimization at partial and capping at blue -- the CI-derived primary grade of blue is confirmed."
  - name: "XNNPACK"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Compute"
    release_provider: "none"
    upstream_release: false
    gap: "The `cmake-linux-riscv64` CI job runs tests via `ctest --label-exclude operator` (not build-only), and the job has been passing since at least 2026-07-08 (verified 2026-08-26 run [#33000168130](https://github.com/google/XNNPACK/actions/runs/33000168130)). The root cause of issue #9886 - unconditional `xnn_arch_riscv_vector_fp16_arith` flag set without Zvfh detection - was fixed in commit `aee6b1b3` (2026-04-07) adding `supports_rvv_fp16()` runtime probe; issue #9886 remains open but the bug is resolved. Optimization level is partial (206 production RVV/Zvfh kernel files covering GEMM, DWCONV, elementwise, reductions; no BF16; no hand-written assembly; narrower MR/NR than arm64), which caps at blue - matching the CI-based grade. No upstream riscv64 release artifacts exist, excluding green."
