    color: "blue"
    criticality: "critical"
    column: null
    layer: "Compute"
    release_provider: "debian"
    upstream_release: false
    gap: "The [Jenkinsfile](https://github.com/shibatch/sleef/blob/master/Jenkinsfile) contains two riscv64 stages (agent label `riscv && ubuntu24`) that both run `ctest -j $(nproc)` with `-DSLEEF_ENFORCE_TESTER4=True`, confirming actual math correctness test execution (not build-only) on a native riscv64 agent. The [helperrvv.h](https://github.com/shibatch/sleef/blob/master/src/arch/helperrvv.h) RVV v1.0 backend covers all in-scope SP and DP transcendentals with RVVM1 and RVVM2 LMUL configurations, matching arm64 SVE coverage and yielding a \"full\" optimization level with no downgrade cap. Upstream ships source-only; the consumable riscv64 binary is provided by Debian sid (3.9.0-1), not upstream, so green is not applicable."
  - name: "Pydantic"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Python Infrastructure"
    release_provider: "upstream"
    upstream_release: true
    gap: "The `core-build` CI job ([ci.yml line 96](https://github.com/pydantic/pydantic/blob/main/.github/workflows/ci.yml)) cross-compiles riscv64 wheels via maturin and uploads them to PyPI; pydantic-core 2.48.0 ships 8 riscv64 manylinux wheels on PyPI. However, the `core-test-builds-arch` job - which runs `pytest tests/pydantic_core` via QEMU for non-native targets - covers only armv7, s390x, ppc64le, and aarch64; riscv64 is absent from that test matrix. The single occurrence of \"riscv\" in the entire CI file is the build target, confirming build-only CI with no test execution on riscv64."
  - name: "httpx"
    color: "green"
    criticality: "critical"
    column: null
    layer: "Python Infrastructure"
    release_provider: "upstream"
    upstream_release: true
