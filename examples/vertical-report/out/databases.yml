- name: RocksDB
  color: orange
  criticality: optional
  column: MariaDB
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: 'Zero riscv64 CI jobs exist across all 14 GitHub Actions workflow files (live-confirmed 2026-08-27: zero matches for
    "riscv" in pr-jobs.yml and nightly.yml). Debian sid ships rocksdb 9.11.2-1 with a successful riscv64 build (host rv-manda-01,
    status "Installed"), but the packaging includes riscv64-relevant patches: patch `0001-replace-old-sync-with-new-atomic-builtin-equivalents.patch`
    explicitly cites riscv32/newer arches as the motivation for replacing `__sync_*` builtins, and `Extend-MIPS-adaptations-to-apply-to-all-remaining-archite.patch`
    extends MIPS timer fallbacks to all remaining architectures including riscv64; vanilla upstream source thus does not build
    cleanly without these fixes, placing the floor at orange (downstream-only). Key unmerged fixes (CMake riscv64 support,
    `-march` typo fix, LLD detection) remain stalled in open [PR #14530](https://github.com/facebook/rocksdb/pull/14530),
    last updated 2026-08-08 with no maintainer response.'
- name: MyRocks
  color: orange
  criticality: optional
  column: MariaDB
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
