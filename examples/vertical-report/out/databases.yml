- PostgreSQL
- MySQL
- MariaDB
- Redis
- Memcached
product_layers:
- Client Drivers
- Database Engine
- Extensions, Clustering & Proxies
shared_layers:
- Orchestration & Observability
- System Libraries
legend:
- color: green
  label: upstream builds+tests+releases; optimized
- color: blue
  label: upstream builds+tests; mostly optimized
- color: yellow
  label: upstream builds; some optimized
- color: orange
  label: no upstream build, distributions only; no optimizations
- color: red
  label: not working
- color: grey
  label: unknown or N/A
