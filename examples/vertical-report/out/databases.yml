    (open, critical since 2022, last updated 2026-06-02) documents that MariaDB's RocksDB plugin requires Debian-carried patches
    to build on riscv64; the distribution floor for a patched build is orange not yellow. Debian sid ships [mariadb-plugin-rocksdb
    11.8.8-1](https://packages.debian.org/sid/riscv64/mariadb-plugin-rocksdb) and Ubuntu 24.04 noble ships [10.11.7-2ubuntu2](https://packages.ubuntu.com/noble/riscv64/mariadb-plugin-rocksdb)
    as the only functional paths.
- name: MariaDB ColumnStore
  color: red
  criticality: optional
  column: MariaDB
  layer: Extensions, Clustering & Proxies
  release_provider: none
  upstream_release: false
  gap: 'Three independent riscv64 blockers are confirmed live on the develop branch as of 2026-08-27: (1) [CMakeLists.txt
    in MariaDB/server](https://github.com/MariaDB/server/blob/main/storage/columnstore/CMakeLists.txt) silently skips the
    entire ColumnStore build when `CMAKE_SYSTEM_PROCESSOR` is not x86_64, amd64, or aarch64; (2) [mcs_int128.h](https://github.com/mariadb-corporation/mariadb-columnstore-engine/blob/develop/datatypes/mcs_int128.h)
    has no `__riscv` guard so GCC falls through to the x86 SSE `movups` inline asm path, causing an assembler error; (3) [archcheck.h](https://github.com/mariadb-corporation/mariadb-columnstore-engine/blob/develop/primitives/primproc/archcheck.h)
    returns UNKNOWN for riscv64 and [primproc.cpp line 711](https://github.com/mariadb-corporation/mariadb-columnstore-engine/blob/develop/primitives/primproc/primproc.cpp)
    hard-aborts with "Unsupported CPU architecture. ARM Advanced SIMD or x86_64 SSE4.2 required; aborting." -- zero riscv64
    issues or PRs exist and no distro packages are available.'
- name: Galera Cluster
  color: yellow
  criticality: optional
  column: MariaDB
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: 'Upstream CI (.travis.yml: Ubuntu Bionic x86-only; Jenkins; no GitHub Actions) targets only x86 with no riscv64 jobs.
    Debian sid builds galera-4 26.4.27-1 successfully on riscv64 (rv-manda-02, confirmed live 2026-08-27 via [Debian buildd](https://buildd.debian.org/status/logs.php?pkg=galera-4&arch=riscv64));
    live check of [debian/rules](https://salsa.debian.org/mariadb-team/galera-4/-/raw/master/debian/rules) confirms `CK_TIMEOUT_MULTIPLIER=5`
    is a global unconditional export ("make slow tests pass on loaded builders"), not a riscv64-specific patch -- clean distro
    build with no architecture-specific patches, confirming yellow and not orange.'
