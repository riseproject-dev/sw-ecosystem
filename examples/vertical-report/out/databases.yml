    delegates all cross-compilation to the [promci/build composite action](https://github.com/prometheus/promci/blob/main/build/action.yml),
    which runs only `promu crossbuild` with no test step; all tests (`test_go` job) run exclusively on `ubuntu-latest` (x86_64).
    Upstream publishes `postgres_exporter-0.20.1.linux-riscv64.tar.gz` on the GitHub releases page, confirming riscv64 build-only
    CI with a released artifact but no test execution on riscv64, which caps the grade at yellow.
- name: MariaDB Connector/C
  color: yellow
  criticality: optional
  column: MySQL
  layer: Client Drivers
  release_provider: Ubuntu
  upstream_release: false
