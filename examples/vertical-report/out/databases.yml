  gap: The [scan.yml CI workflow](https://github.com/percona/percona-server-mysql-operator/blob/main/.github/workflows/scan.yml)
    builds only `linux/amd64` and `linux/arm64`; no riscv64 job exists in any workflow (scan.yml, tests.yml, reviewdog.yml).
    No riscv64 container image is published (GitHub releases v1.0.0-v1.2.0 all have zero binary assets). The distribution
    floor does not apply because this operator has no Debian/Ubuntu/Arch package -- it is distributed exclusively as container
