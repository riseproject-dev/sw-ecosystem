title: Databases (OLTP + OLAP + KV/cache) -- self-managed open-source database stack
target_profile: RVA23U64
hardware_label: 'Hardware: RISC-V CPU (RVA23U64)'
columns:
- PostgreSQL
- MySQL
- MariaDB
- Redis
- Memcached
product_layers:
- Client Drivers
- Database Engine
- Extensions, Clustering & Proxies
- Orchestration & Observability (per-product)
shared_layers:
- Orchestration & Observability
- System Libraries
legend:
- color: green
  label: upstream builds+tests+releases; optimized
- color: blue
  label: upstream builds+tests; mostly optimized
- color: yellow
  label: upstream builds; some optimized
- color: orange
  label: no upstream build, distributions only; no optimizations
- color: red
  label: not working
- color: grey
  label: unknown or N/A
nodes:
- name: libpq
  color: blue
  criticality: critical
  column: PostgreSQL
  layer: Client Drivers
  release_provider: Debian
  upstream_release: false
  gap: libpq is built in-tree with PostgreSQL (src/interfaces/libpq) and shares its riscv64 status entirely. The primary GitHub
    Actions pipeline (pg-ci.yml) has zero riscv64 references, but the PostgreSQL Build Farm -- the project's official distributed
    CI -- has 3 active riscv64 workers (boomslang, copperhead on Debian 13/gcc14; greenfly on Ubuntu 24.04/clang 22.1.6) that
    run the full regression suite on master and all supported stable branches ([Build Farm riscv64 members](https://buildfarm.postgresql.org/cgi-bin/show_members.pl?os=Linux&arch=riscv64)).
    PostgreSQL ships source-only tarballs; libpq5 riscv64 is available in Debian trixie, Ubuntu 24.04 Noble (ports), and Arch
    Linux RISC-V (18.4-1). The report cited 4 workers; a live check on 2026-08-27 shows mollusk has dropped off, leaving 3
    active workers.
- name: psycopg
  color: green
  criticality: optional
  column: PostgreSQL
  layer: Client Drivers
  release_provider: upstream
  upstream_release: true
  gap: 'The `packages-bin.yml` CI workflow (read live from psycopg/psycopg) includes `riscv64` in its full build matrix and
    executes `pytest {project}/tests` (with `-m ''not slow and not flakey''`) against a live PostgreSQL service under QEMU
    for every riscv64 arch/platform combination - this is not build-only CI. Upstream publishes 10 riscv64 binary wheels for
    psycopg_binary 3.3.4 on PyPI (confirmed live: manylinux_2_39 and musllinux_1_2, Python 3.10-3.14). The pure-Python `psycopg`
    package (py3-none-any) is architecture-independent. No optimization-purpose modifier applies; psycopg is a protocol adapter
    with no SIMD or architecture-specific code.'
- name: pgx
  color: green
  criticality: optional
  column: PostgreSQL
  layer: Client Drivers
  release_provider: upstream
  upstream_release: true
  gap: pgx is a pure-Go library with no assembly, no CGo, and no ISA-specific code; Step 0 applies. The live CI workflow ([ci.yml](https://github.com/jackc/pgx/blob/master/.github/workflows/ci.yml))
    confirms only ubuntu-22.04 and windows-latest runners, with zero references to riscv64, arm64, QEMU, or cross-compilation
    -- but Step 0 explicitly waives the CI requirement for architecture-independent projects. pgx publishes no compiled binary
    releases; it is consumed as Go module source via `go get github.com/jackc/pgx/v5`, with upstream (jackc) as the sole publisher,
    satisfying the green release-provider prerequisite.
- name: pgjdbc
  color: green
  criticality: optional
  column: PostgreSQL
  layer: Client Drivers
  release_provider: upstream
  upstream_release: true
  gap: pgjdbc is a pure-Java Type 4 JDBC driver with no native code, no JNI, and no architecture-specific bytecode; Step 0
    applies. Live verification of [REL42.7.13](https://github.com/pgjdbc/pgjdbc/releases/tag/REL42.7.13) (published 2026-07-06)
    confirms only `postgresql-42.7.13.jar` and its PGP signature are published -- no platform-specific assets. A recursive
    tree search of the repository finds zero native library files (.so, .dll, .dylib, JNI). riscv64 support is inherited entirely
    from the JVM runtime.
- name: PostgreSQL
  color: blue
  criticality: critical
  column: PostgreSQL
  layer: Database Engine
  release_provider: Debian
  upstream_release: false
  gap: The PostgreSQL Build Farm (upstream-hosted at buildfarm.postgresql.org) has 3 active riscv64 workers (boomslang, copperhead,
    greenfly) running the full regression and tap test suite on master and all supported stable branches with no failures,
    confirmed live on [buildfarm.postgresql.org](https://buildfarm.postgresql.org/cgi-bin/show_members.pl?os=Linux&arch=riscv64).
    PostgreSQL ships source-only with no upstream binary releases for any architecture, so release provider is the distro.
    JIT is disabled on riscv64 in all distro packages due to LLVM segfaults, and Zbb/Zbc optimization patches (v4, Greg Burd)
    remain unmerged, but these are performance gaps only and do not affect the blue classification since PostgreSQL is not
    an optimization-purpose project under the color model.
- name: pgvector
  color: yellow
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: Ubuntu
  upstream_release: false
  gap: 'pgvector has no riscv64 CI ([build.yml](https://github.com/pgvector/pgvector/blob/master/.github/workflows/build.yml)
    confirmed: "riscv" appears nowhere), but Ubuntu 24.04 noble ships postgresql-16-pgvector (0.6.0-1) for riscv64 built from
    unmodified upstream source (PR [#948](https://github.com/pgvector/pgvector/pull/948) merged upstream 2026-01-14, the sole
    riscv64 change, confirms no distro patch is needed), qualifying for the yellow clean-distro-build floor. The optimization-purpose
    modifier does not apply: pgvector''s primary value is the HNSW/IVFFlat ANN index algorithm and PostgreSQL integration,
    which remain fully functional on riscv64 via scalar C fallbacks -- scalar pgvector still far outperforms a brute-force
    SQL scan, so the project delivers its core value without RISC-V-specific optimizations.'
- name: PostGIS
  color: yellow
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: 'PostGIS has zero upstream riscv64 CI: the live `.woodpecker/portability.yml` covers armhf, arm64v8, and s390x via
    QEMU but omits riscv64, confirmed by reading the file directly. Debian sid ships postgis 3.6.4+dfsg-2 for riscv64 with
    "Installed" status, and the Debian patch set (sfcgal-2.3.0.patch, relax-test-timing-constraints.patch, incorrect-path-for-interpreter.patch)
    contains no riscv64-specific patches, qualifying for the clean-distro-build yellow floor per the color model. PostGIS
    contains no architecture-specific code and is not an optimization-purpose project, so no downgrade modifier applies.'
- name: TimescaleDB
  color: yellow
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: Debian builds and ships timescaledb 2.29.2+dfsg-1 on riscv64 with status "Installed" on buildd (rv-manda-04), confirmed
    via [buildd.debian.org](https://buildd.debian.org/status/package.php?p=timescaledb&suite=sid). The only Debian patch is
    [no-git-hook](https://salsa.debian.org/postgresql/timescaledb/-/raw/master/debian/patches/series), which removes a CMake
    git-hook installation step and is entirely architecture-neutral -- no riscv64-specific patches exist. This satisfies the
    clean-distro-build condition for yellow, upgrading from the proposed orange.
- name: Apache AGE
  color: yellow
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: All 5 upstream GitHub Actions workflows run exclusively on ubuntu-24.04/ubuntu-latest (x86_64) with no riscv64 matrix
    axis, confirmed by reading [installcheck.yaml](https://github.com/apache/age/blob/master/.github/workflows/installcheck.yaml)
    live. Upstream GitHub Releases publish source tarballs only (confirmed live). Debian packages postgresql-18-age for riscv64
    from unmodified upstream source with zero architecture-specific patches, producing a verified ELF64 RISC-V shared object
    (documented in report via binary inspection on rv-osuosl-02); release is provided by Debian, not upstream.
- name: Citus
  color: grey
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: none
