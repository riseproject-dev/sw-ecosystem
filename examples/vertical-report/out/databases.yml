    the Step 0 architecture-independent shortcut: it compiles and runs on linux/riscv64 by construction using any Go 1.24+
    toolchain. Live inspection of [`.github/workflows/test.yml`](https://github.com/go-sql-driver/mysql/blob/master/.github/workflows/test.yml)
    confirms no riscv64 CI exists (runners are `ubuntu-latest`, `macos-latest`, `windows-latest` only), but Step 0 makes CI
    irrelevant for a source-only Go module with no compiled artifacts. The project distributes exclusively as a Go module
