    with zero riscv matches). Ubuntu noble ships `libmariadb3` for riscv64 via the ports archive (version `1:10.11.7-2ubuntu2`),
    built from the `mariadb` source package (MariaDB Server 10.11.x, which bundles the connector) with no riscv64-specific
