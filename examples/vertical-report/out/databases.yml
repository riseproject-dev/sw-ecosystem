  gap: Data not available.
- name: Patroni
  color: green
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: upstream
  upstream_release: true
  gap: 'Patroni is pure Python with no compiled extensions; the live PyPI check for v4.1.5 returns exactly one wheel, `patroni-4.1.5-py3-none-any.whl`,
    published directly by upstream. Step 0 applies: architecture-independent, inherits riscv64 from CPython. The `.github/workflows/tests.yaml`
    contains zero references to "riscv" (verified live against master), confirming no riscv64 CI exists and none is needed
    -- the color requires only that the upstream artifact be architecture-neutral, which it is.'
- name: PgBouncer
  color: yellow
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: Live inspection of [pgbouncer-ci.yml](https://github.com/pgbouncer/pgbouncer/blob/main/.github/workflows/pgbouncer-ci.yml)
    on 2026-08-27 confirms zero riscv64 references -- runners are ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15,
    and windows-2022 only. Debian sid ships pgbouncer 1.25.2-1 built from unpatched upstream source on host rv-osuosl-01 with
    status "Installed" ([Debian buildd](https://buildd.debian.org/status/package.php?p=pgbouncer&suite=sid)), qualifying for
    the yellow clean-distro-build floor. PgBouncer is a network proxy daemon (connection pooling), not an optimization-purpose
    project, so the optimization modifier does not apply.
- name: Pgpool-II
  color: yellow
  criticality: optional
  column: PostgreSQL
  layer: Extensions, Clustering & Proxies
  release_provider: Debian
  upstream_release: false
  gap: 'Pgpool-II has zero upstream CI for any architecture: `gh api repos/pgpool/pgpool2/contents/.github` returns HTTP 404,
    confirming no `.github/workflows` directory exists. The only Debian patch (`pgpool2-debian-config.patch`, 2016) adjusts
    default socket and pid-file paths -- a generic Debian packaging convention with no riscv64-specific content -- satisfying
    the clean-distro-build floor. Both [Debian sid](https://buildd.debian.org/status/package.php?p=pgpool2&suite=sid) and
    [Ubuntu 24.04 Noble](https://packages.ubuntu.com/noble/pgpool2) ship riscv64 binary packages from unpatched upstream source,
    confirming yellow (clean-distro-build).'
- name: pgcat
  color: grey
