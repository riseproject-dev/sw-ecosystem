- name: CloudNativePG
  color: orange
  criticality: optional
  column: PostgreSQL
  layer: Orchestration & Observability (per-product)
  release_provider: none
  upstream_release: false
  gap: 'The [release-publish.yml](https://github.com/cloudnative-pg/cloudnative-pg/blob/main/.github/workflows/release-publish.yml)
    hardcodes `platforms="linux/amd64,linux/arm64"` with no riscv64 entry, confirmed live. The [v1.30.0 release assets](https://github.com/cloudnative-pg/cloudnative-pg/releases/tag/v1.30.0)
    contain linux binaries for arm64, ppc64le, s390x, and x86_64 but no riscv64 binary or container image manifest. Critically,
    the proposed `color_case: downstream-only` is wrong: no downstream distro (Ubuntu, Debian, Arch, Fedora) ships a CloudNativePG
    package at all -- this Kubernetes operator is distributed exclusively as a container image, and no riscv64 container image
    exists at any tier. The color remains orange (no CI, no artifacts) but with an empty color_case since neither `downstream-only`
    (requires a distro to ship it) nor `optimization-absent` (requires an optimization-purpose project) applies.'
- name: Zalando postgres-operator
  color: orange
  criticality: optional
  column: PostgreSQL
  layer: Orchestration & Observability (per-product)
  release_provider: none
  upstream_release: false
  gap: 'The [publish_ghcr_image.yaml](https://github.com/zalando/postgres-operator/blob/master/.github/workflows/publish_ghcr_image.yaml)
    workflow explicitly lists `platforms: linux/amd64,linux/arm64` for all four image builds (operator, pooler, UI, logical-backup)
    with no riscv64 entry. No distro package exists in Ubuntu Noble, no riscv64 assets appear in GitHub releases (v2.0.2 has
    0 assets), and zero riscv64 issues or code references exist in the repository. Orange is confirmed; color_case "downstream-only"
    is a slight overstatement since no distro ships it, but no better sub-type exists for plain absent-CI with no distribution
    floor.'
- name: Percona Operator for MySQL
  color: orange
  criticality: optional
  column: PostgreSQL
  layer: Orchestration & Observability (per-product)
  release_provider: none
