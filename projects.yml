# Project registry: the canonical database of open-source projects tracked in this repo.
#
# Each entry has a canonical `name` plus `repo` (upstream source repository) and `home`
# (project homepage). Optional fields:
#   report:   path to the per-project RISC-V report under project-reports/ (only when one exists).
#   synonyms: alternate names this project appears under in the dependency graphs
#             (stack-reports/*/*.graph.json); used to converge graph nodes onto one entry.
