nodes:
  - name: "llama.cpp"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "debian"
    upstream_release: false
    gap: "Native riscv64 CI on RISE-provided `ubuntu-24.04-riscv` runners builds with native gcc-14 and executes `ctest -L main` plus an end-to-end llama2c inference test on every push to master, confirmed live by reading [build-riscv.yml](https://github.com/ggerganov/llama.cpp/blob/master/.github/workflows/build-riscv.yml). Upstream publishes no riscv64 release binaries (PR [#20991](https://github.com/ggerganov/llama.cpp/pull/20991) remains open, issue [#20988](https://github.com/ggerganov/llama.cpp/issues/20988) was closed as not-planned); Debian 13 Trixie ships riscv64 packages `libllama0` and `libllama-dev`. The optimization modifier caps at blue (partial): quants.c has full RVV vec_dot coverage across all major formats (Q2_K through Q6_K, IQ1_S through IQ4_XS), but repack.cpp GEMM/GEMV tiled paths cover only Q4_0, Q4_K, Q2_K, Q8_0, and IQ4_NL -- Q3_K, Q5_K, and Q6_K tiled GEMM/GEMV paths are absent, leaving those formats at the vec_dot scalar-tiling fallback for batched matrix operations."
  - name: "ONNX Runtime (edge / mobile EP)"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "debian"
    upstream_release: false
    gap: "No riscv64 CI exists in microsoft/onnxruntime: a live check on 2026-08-29 scanned all 51 GitHub Actions workflow files and found zero riscv64 hits, confirming the [project report](https://github.com/microsoft/onnxruntime). Debian sid ships a riscv64 binary (v1.23.2+dfsg) built from unpatched upstream source -- the `+dfsg` suffix denotes DFSG source stripping only, not riscv64-specific patches -- which lifts the floor to yellow (clean-distro-build). The optimization-purpose modifier for MLAS CPU EP rates coverage as partial (11 RVV intrinsics files covering SGEMM, INT8/FP16 GEMM, convolution, pooling, LayerNorm, RMSNorm, RoPE, activations; BF16 GEMM and FP16 RoPE are stubs), capping at blue -- which does not further constrain the yellow floor. No grounds to downgrade to orange: the report found no riscv64-specific patches in the Debian packaging, and upstream build support for riscv64 has existed since PR #19238 (January 2024)."
  - name: "TensorFlow Lite / LiteRT"
    color: "orange"
    criticality: "critical"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "All 16 GitHub Actions workflow files (confirmed live 2026-08-29; 3 new files added since June 2026 report, all zero riscv64 references) contain no riscv64 jobs, no riscv64 wheel has ever appeared on PyPI, and LiteRT is absent from all Linux distro riscv64 repositories. As an optimization-purpose inference runtime whose primary value is accelerated CPU inference via XNNPACK, the optimization modifier caps at orange: Section 4 of [the project report](https://github.com/google-ai-edge/LiteRT/tree/main/tflite/kernels/internal/optimized) confirms 0 RVV files vs 4 NEON and 4 SSE files, with all RISC-V execution falling to scalar portable C. The blocking chain runs through [cpuinfo #124](https://github.com/pytorch/cpuinfo/issues/124) (still open, Zvfh detection missing) and [XNNPACK #9886](https://github.com/google/XNNPACK/issues/9886) (still open, 100+ RVV FP16 CI failures)."
  - name: "TensorFlow Lite Micro (TFLM)"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "Upstream CI in [suite_riscv.yml](https://github.com/tensorflow/tflite-micro/blob/main/.github/workflows/suite_riscv.yml) and [merge_group.yml](https://github.com/tensorflow/tflite-micro/blob/main/.github/workflows/merge_group.yml) targets riscv32 MCU only (TARGET=riscv32_generic, arch rv32imc, QEMU riscv32) as confirmed by [test_riscv.sh](https://github.com/tensorflow/tflite-micro/blob/main/tensorflow/lite/micro/tools/ci_build/test_riscv.sh); there is no riscv64 build target (only [riscv32_generic_makefile.inc](https://github.com/tensorflow/tflite-micro/blob/main/tensorflow/lite/micro/tools/make/targets/riscv32_generic_makefile.inc) exists), no riscv64 CI, and no riscv64 release artifacts (PyPI wheels are x86_64-only, no GitHub releases). The project provides architecture-specific optimized kernels for Cortex-M/CMSIS-NN, Hexagon, and Xtensa but has zero riscv64-specific kernel code, leaving all riscv64 paths as scalar C fallback; combined with no riscv64 CI and no distro packaging, this caps at orange (optimization-absent)."
  - name: "ExecuTorch"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: ""
  - name: "ncnn"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "ncnn has dedicated [linux-riscv64 CI](https://github.com/Tencent/ncnn/blob/master/.github/workflows/linux-riscv64.yml) with explicit `ctest` test steps on riscv64 via QEMU (gcc-riscv64, gcc-rvv vlen=128/256, clang-rvv vlen=128/256) plus self-hosted XuanTie and SpacemiT jobs, all confirmed to run the full test suite and not merely build. The [src/layer/riscv/](https://github.com/Tencent/ncnn/tree/master/src/layer/riscv) directory contains 180 files covering all primary hot paths (convolution, GEMM, depthwise, pooling, attention, normalization) with RVV intrinsics and ZFH/ZVFH fp16 -- full optimization coverage. The [20260526 release](https://github.com/Tencent/ncnn/releases/tag/20260526) has no standalone Linux riscv64 prebuilt, only Android bundles, so blue (not green) is correct."
  - name: "MNN (Alibaba)"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "No riscv64 CI exists in any workflow: linux.yml, mnn_release.yml, pymnn_linux.yml, and android.yml all run exclusively on ubuntu-latest (x86_64), confirmed by reading [.github/workflows/linux.yml](https://github.com/alibaba/MNN/blob/master/.github/workflows/linux.yml) and [mnn_release.yml](https://github.com/alibaba/MNN/blob/master/.github/workflows/mnn_release.yml). Release artifacts cover android/arm, iOS, Linux-x64, macOS, and Windows only -- no riscv64 binary in any of the three most recent releases (3.6.1, 3.6.0, 3.5.0). The proposed color_case of downstream-only is incorrect: Alibaba's MNN is not packaged by Ubuntu, Debian, or Arch Linux RISC-V for any architecture, so there is no downstream either; orange is correct but solely because no upstream CI exists -- the 93 RVV source files under source/backend/cpu/riscv/rvv/ (covering matmul, INT8 GEMM, attention, depthwise conv, activations) are untested by CI."
  - name: "PaddlePaddle Lite"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "The only CI file is a lint-only `.travis.yml` (no build or test jobs); no `.github/workflows` directory exists. The [lite/kernels directory](https://github.com/PaddlePaddle/Paddle-Lite/tree/develop/lite/kernels) contains backends for arm, host, metal, nnadapter, opencl, x86, and xpu but no riscv backend, and a full-repo code search returns zero hits for \"riscv\". Release assets through v2.14-rc cover only arm, x86, iOS, and macOS -- no riscv64 artifact. As an optimization-purpose inference runtime with absent RISC-V optimization (all paths fall back to generic scalar via the \"host\" backend), the grade is capped at orange."
  - name: "MindSpore Lite (Huawei)"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "The active development repository is `mindspore-ai/mindspore-lite` (last pushed 2026-08-29), not the archived monorepo cited in the proposal. It has a cross-compilation build path for rv64 (`MSLITE_CROSS_RISCV=rv64`) and an `rvv/` kernel directory; `adderfloat_rvv.c` contains genuine RVV intrinsics (vsetvl, vle32, vfsub, vfadd, etc.) for element-wise activation ops, but `matmul_rvv.c` -- the critical hot path -- uses scalar C only despite being in the rvv/ directory. No upstream CI builds or tests riscv64 (Jenkins-only lint checks; no GitHub Actions), no riscv64 release artifacts exist, and the primary optimization value (matrix multiplication for inference) has no real RVV implementation, so the optimization-absent cap at orange applies and the no-CI base color of orange is confirmed. See [mindspore-ai/mindspore-lite rvv directory](https://github.com/mindspore-ai/mindspore-lite/tree/master/mindspore-lite/src/litert/kernel/cpu/nnacl_c/intrinsics/rvv)."
  - name: "OpenVINO Runtime"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: ""
  - name: "Apache TVM / microTVM"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: "No upstream riscv64 CI exists: the cpu_jenkinsfile defines `ci_riscv = ''` as an empty placeholder and no corresponding Docker image is in [docker-images.ini](https://github.com/apache/tvm/blob/main/ci/jenkins/docker-images.ini) (confirmed live 2026-08-29); no riscv64 wheel is published on PyPI (latest 0.26.0 covers x86_64, aarch64, macOS arm64, Windows only); no Linux distribution packages TVM for riscv64. The proposed `optimization-absent` color_case is incorrect: TVM has RISC-V-specific optimizations in [riscv_cpu.py](https://github.com/apache/tvm/blob/main/python/tvm/s_tir/tensor_intrin/riscv_cpu.py) (241-line RVV dot-product kernel intrinsics using `rvv_vec_dot_product_kernels`) and SiFive/SpacemiT CPU target tags -- but coverage is minimal (dot-product only; no RISC-V-specific dlight GEMV/GEMM schedule rules comparable to arm64 SME/NEON), which would cap at yellow under the optimization modifier -- a cap that has no effect since the primary grade is already orange from absent CI."
  - name: "whisper.cpp"
    color: "blue"
    criticality: "optional"
    column: null
    layer: "ML Inference Runtimes"
    release_provider: "none"
    upstream_release: false
    gap: ""
  - name: "ONNX (format + tooling)"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Model Optimization & Conversion"
    release_provider: "RISE"
    upstream_release: false
    gap: "Upstream CI ([release_linux_cibw.yml](https://github.com/onnx/onnx/blob/main/.github/workflows/release_linux_cibw.yml)) covers only x86_64 and aarch64 with no riscv64 job, and no riscv64 wheel is published to PyPI by upstream. Ubuntu resolute (26.04) ships `python3-onnx` 1.20.0-1 and `libonnx-dev` 1.20.0-1 for riscv64 with only generic packaging patches (cmake-no-rpath, fix-shebang, soversion -- no architecture-specific patches), qualifying as a clean distro build and triggering the yellow distribution floor. RISE additionally provides current `onnx-1.22.0-cp312-abi3-manylinux_2_39_riscv64.whl` wheels covering v1.19.1 through v1.22.0; ONNX is a protobuf schema and tooling library with no architecture-specific compute kernels, so the optimization modifier does not apply."
  - name: "Intel Neural Compressor (INC)"
    color: "green"
    criticality: "optional"
    column: null
    layer: "Model Optimization & Conversion"
    release_provider: "upstream"
    upstream_release: true
    gap: "Intel Neural Compressor v3.9 ships as [neural_compressor-3.9-py3-none-any.whl](https://pypi.org/pypi/neural-compressor/3.9/json) with `ext_modules=[]` unconditionally in setup.py and zero C/C++/Cython/CUDA files in the repository tree, making it architecture-independent pure Python that runs on riscv64 by construction (Step 0 shortcut). The wheel is published directly to PyPI by the Intel AIPT team (suyue.chen@intel.com), so release_provider is upstream. INC is a Python orchestration layer for quantization workflows that delegates compute to PyTorch/TF/JAX backends, so the optimization-purpose modifier (Step 2) does not apply."
  - name: "NNCF (Neural Network Compression Framework, Intel)"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "Model Optimization & Conversion"
    release_provider: "upstream"
    upstream_release: true
    gap: "Although the PyPI artifact is a `py3-none-any` wheel, NNCF ships C++/CUDA source files under `src/nncf/torch/extensions/` that are JIT-compiled at runtime via `torch.utils.cpp_extension.load()` with `ninja` as a hard dependency ([pyproject.toml](https://github.com/openvinotoolkit/nncf/blob/develop/pyproject.toml), [extensions.py](https://github.com/openvinotoolkit/nncf/blob/develop/src/nncf/torch/quantization/extensions.py)); this disqualifies the Step 0 \"architecture-independent\" shortcut. All CI workflows run exclusively on `ubuntu-latest` (x86_64) or GPU runners -- no riscv64 build or test job exists -- placing this at orange under Step 1 (no upstream riscv64 CI). The CPU extension does have a graceful Python fallback on compile failure, but the project has never been tested on riscv64 and no distro floor has been established."
  - name: "HuggingFace Optimum"
    color: "green"
    criticality: "optional"
    column: null
    layer: "Model Optimization & Conversion"
    release_provider: "upstream"
    upstream_release: true
    gap: "HuggingFace Optimum ships exclusively as a `py3-none-any` wheel (confirmed for the latest release [optimum 2.3.0](https://pypi.org/pypi/optimum/2.3.0/json)). A scan of the full repository tree confirms zero compiled source files (.c, .cpp, .rs, etc.) and `setup.py` declares no `ext_modules`, making the package architecture-independent. Step 0 applies: green by construction, no riscv64 CI required or penalized for absence."
  - name: "XNNPACK"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Kernel Libraries & Compute Primitives"
    release_provider: "none"
    upstream_release: false
    gap: ""
  - name: "OpenBLAS"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Kernel Libraries & Compute Primitives"
    release_provider: "debian"
    upstream_release: false
    gap: "Upstream [riscv64_vector.yml](https://github.com/OpenMathLib/OpenBLAS/blob/develop/.github/workflows/riscv64_vector.yml) builds and runs the full BLAS L1/L2/L3 test suite under QEMU for ZVL128B, ZVL256B, and DYNAMIC_ARCH on every push/PR, confirming blue CI posture (tests pass, no upstream riscv64 binary release - only Windows and source tarballs in GitHub releases). The optimization modifier is partial: GEMM and GEMV have full RVV 1.0 coverage for all precisions; TRSM gained RVV kernels via [PR #5830](https://github.com/OpenMathLib/OpenBLAS/pull/5830) (merged 2026-08-16) giving STRSM full RVV coverage, but DTRSM LN/LT, CTRSM LN/LT, and ZTRSM LN/LT/RN still fall back to generic C on both ZVL128B and ZVL256B targets. Partial optimization caps at blue, matching the CI grade."
  - name: "SLEEF"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Kernel Libraries & Compute Primitives"
    release_provider: "debian"
    upstream_release: false
    gap: "The Jenkinsfile at shibatch/sleef has two riscv64 stages on `riscv && ubuntu24` agents that run `ctest` with `-DSLEEF_ENFORCE_TESTER4=True -DSLEEF_ENFORCE_RVVM1=True -DSLEEF_ENFORCE_RVVM2=True`; TLFloat-based tester4 accuracy tests execute for all transcendentals -- confirmed genuine test execution, not build-only ([Jenkinsfile](https://github.com/shibatch/sleef/blob/master/Jenkinsfile)). The RVV backend in `src/arch/helperrvv.h` (1407 lines of RVV intrinsics) covers all SP and DP transcendentals for RVVM1 and RVVM2, delivering full optimization coverage with no downward cap. Upstream GitHub releases are source-only (no binary assets for any arch); Debian sid ships `libsleef3` 3.9.0-1 for riscv64 from unpatched upstream source (no riscv64-specific patches in debian/patches/, confirmed via [sources.debian.org](https://sources.debian.org/src/sleef/3.9.0-1/debian/patches/))."
  - name: "ARM Compute Library (ACL) [ARM Only]"
    color: "grey"
    criticality: "optional"
    column: null
    layer: "Kernel Libraries & Compute Primitives"
    release_provider: "none"
    upstream_release: false
    gap: "ARM Compute Library is by design exclusive to Arm architectures: the README explicitly states it is \"optimized for Arm Cortex-A, Neoverse, and Mali GPU architectures,\" CMakeLists.txt only supports armv8-a/armv8.2-a/armv8.6-a targets, and a full GitHub code search returns zero files referencing riscv. All upstream releases (confirmed through v53.2.0) are exclusively aarch64 and armv7a binaries with no riscv64 variant. The project-graph confirms no riscv64 distro package exists. RISC-V is not applicable by design."
  - name: "RUY (Google matrix multiply)"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "Kernel Libraries & Compute Primitives"
    release_provider: "ubuntu"
    upstream_release: false
    gap: "Adversarial verification confirms the proposed color. No .github/workflows directory exists (404 from GitHub API), confirming zero upstream CI for any architecture. Ubuntu 26.04 (resolute) and Ubuntu 24.04 (noble) both ship libruy-dev for riscv64 (confirmed via project graph: version 0.0.0~git20230215.21a85fe-3, suite resolute, arch riscv64); the single Debian packaging patch (Remove_cxx14_compat.patch) removes a generic -Wc++14-compat warning flag from CMakeLists.txt for all architectures and is not riscv64-specific, so the clean-distro-build yellow floor applies. Ruy is an optimization-purpose library (SIMD matmul) with zero RISC-V-specific code -- no RUY_PLATFORM_RISCV macro, no RVV kernel, no riscv64 path enum entry (confirmed live in platform.h and path.h) -- so the absent-optimization cap lowers yellow to orange."
  - name: "FlatBuffers"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Kernel Libraries & Compute Primitives"
    release_provider: "ubuntu"
    upstream_release: false
    gap: "Upstream [google/flatbuffers](https://github.com/google/flatbuffers) has no riscv64 CI in any of its six workflow files -- confirmed by live check of [build.yml](https://github.com/google/flatbuffers/blob/master/.github/workflows/build.yml) (no riscv64, QEMU, or cross-compile references). Ubuntu 26.04 (resolute) ships `libflatbuffers-dev`, `libflatbuffers23.5.26`, `flatbuffers-compiler`, and `flatbuffers-compiler-dev` at 23.5.26+dfsg-4build1 for riscv64 (confirmed via project-graph); the three Debian packaging patches (`8201.patch` for mips/hppa NaN, `s390x.patch` for GCC warning suppression, `setup-py.patch`) are none of them riscv64-specific, confirming a clean unpatched upstream build on riscv64. FlatBuffers is architecture-agnostic (no SIMD, no assembly), so no optimization gap exists."
  - name: "OpenCV"
    color: "blue"
    criticality: "critical"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "ubuntu"
    upstream_release: false
    gap: "The `OCV-PR-5.x-RISCV.yaml` workflow in the `opencv/ci-gha-workflow` repo defines a `BuildAndTest` job that cross-compiles with RVV enabled and then executes three accuracy test suites (core, imgproc, dnn) under QEMU; the nightly `OCV-Nightly-RISCV.yaml` runs the same suites on real RISC-V boards (`lichee1`, `canmv1`). Upstream publishes no riscv64 release artifact (the 5.0.0 release ships only Android, iOS, Windows, and docs), but Ubuntu ships `python3-opencv` for riscv64 from noble (24.04 LTS) onward at version 4.10.0, placing release_provider at ubuntu. OpenCV also has a broad RVV HAL under `hal/riscv-rvv/` covering core, imgproc, dnn, and features2d hot paths, giving a partial-to-full optimization level that does not cap below blue."
  - name: "GStreamer"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "ubuntu"
    upstream_release: false
    gap: "GStreamer's own monorepo has no riscv64 CI job of any kind (confirmed live against the [GitHub mirror CI config](https://raw.githubusercontent.com/GStreamer/gstreamer/main/.gitlab-ci.yml) on 2026-08-29). The distribution floor applies: Ubuntu 26.04 \"Resolute\" ships libgstreamer1.0-0 1.28.2-1 and a full plugin set for riscv64 (confirmed via project graph and [packages.ubuntu.com/resolute/libgstreamer1.0-0](https://packages.ubuntu.com/resolute/libgstreamer1.0-0)), with no riscv64-specific patches in the Debian packaging diff. ORC (GStreamer's SIMD layer) gained a native riscv64 CI job with meson test execution on 2026-08-05 -- a meaningful positive signal for the dependency stack -- but GStreamer's own grade is driven by its own CI posture, not ORC's."
  - name: "MediaPipe"
    color: "orange"
    criticality: "optional"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "none"
    upstream_release: false
    gap: "The only CI workflow in google/mediapipe is `stale.yaml` (issue management); there is no build or test CI for any architecture. PyPI lists wheels only for x86_64 and aarch64/arm64 across all versions including v1.0.1 -- no riscv64 wheel has ever been published ([PyPI JSON](https://pypi.org/pypi/mediapipe/json)). A code search for \"riscv64\" across the entire repository returns zero results, and no Linux distribution (Debian, Ubuntu Noble, Arch RISC-V) packages mediapipe for riscv64. The proposed `color_case: downstream-only` was incorrect: that sub-type requires a downstream distro to be shipping the package, which is not the case here; plain orange (no CI, no distro coverage) is the correct classification."
  - name: "Mosquitto (Eclipse)"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "none"
    upstream_release: false
    gap: ""
  - name: "Node-RED"
    color: "green"
    criticality: "optional"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "upstream"
    upstream_release: true
    gap: "Node-RED is effectively architecture-independent: it ships no compiled code of its own (no gypfile, no cpu/os fields), and its sole native optionalDependency (`@node-rs/bcrypt` 1.10.7) has an explicit try/catch fallback to the pure-JS `bcryptjs` in [`packages/node_modules/@node-red/editor-api/lib/auth/users.js`](https://github.com/node-red/node-red/blob/main/packages/node_modules/%40node-red/editor-api/lib/auth/users.js), so the absence of a riscv64 prebuilt for `@node-rs/bcrypt` does not affect functionality. Upstream publishes releases directly to npm (latest: v5.0.4), and the Step 0 architecture-independent shortcut applies -- no riscv64 CI is required for this grade. The proposed justification claiming \"all 57 dependencies are pure JavaScript\" was slightly inaccurate (one optional native dep exists) but the green conclusion stands because full functionality is preserved on riscv64 via the pure-JS fallback."
