  - name: "SQLite"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "ubuntu"
    upstream_release: false
    gap: "SQLite has no upstream CI of any kind -- the GitHub mirror's `.github/` directory returns HTTP 404, confirmed live. No upstream riscv64 artifact is published (official downloads provide Linux x64 only). Ubuntu 24.04 and Debian sid (3.53.4-2, \"Installed\" on rv-manda-01) both ship sqlite3 for riscv64 from unpatched upstream source: the Debian packaging contains 11 patches, none riscv64-specific (the two cross-compilation patches are generic fixes applicable to all target architectures). The optimization-purpose modifier does not apply -- SQLite is pure portable C with no SIMD, no assembly, and no JIT on any architecture."
  - name: "V4L2 (Video4Linux2)"
    color: "yellow"
    criticality: "critical"
    column: null
    layer: "Data Pipeline & Local Processing"
    release_provider: "Debian"
    upstream_release: false
