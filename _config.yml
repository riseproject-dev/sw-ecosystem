# SPDX-License-Identifier: MIT
title: "RISE Software Ecosystem"
description: "RISC-V Software Ecosystem Status Reports and Readiness Assessments"

destination: _site

url: "https://riseproject-dev.github.io"
baseurl: "/sw-ecosystem"

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme

color_scheme: light

mermaid:
  version: "11"

callouts:
  highlight:
    color: yellow
  note:
    color: blue
  important:
    color: purple
  warning:
    color: red

nav_sort: order

defaults:
  - scope:
      path: ""
    values:
      layout: default

footer_content: "RISE Project"
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/riseproject-dev/sw-ecosystem"

exclude:
  - "*.gemspec"
  - "*.lock"
  - "CLAUDE.md"
  - "GEMINI.md"
  - "README.md"
  - ".claude/"
  - ".gemini/"
  - ".github/"
  - ".gitignore"
  - "project-graph-mcp/"
  - "prompts/README.md"
  - "prompts/*/AGENTS.md"
  - "prompts/*/*.js"
  - "prompts/*/*.py"
  - "prompts/*/*.txt"
  - "prompts/*/*.yml"
  - "stack-reports/*/*.scope.yml"
  - "_config.yml"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor/"
